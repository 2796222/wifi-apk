var currentCallBack = null;
var nonedatav = Math.random();
//åéè¯·æ±åå®¹
function sendRequest(url,param,callback){
    currentCallBack = callback;
    createXmlhttp ();
	try{
		//xmlhttp.onreadystatechange = processResponse;  //åè°æ¹æ³
		xmlhttp.open("post",url + ".cgi",false); // trueå¼æ­¥
		xmlhttp.setRequestHeader("content-type","application/x-www-form-urlencoded");
		xmlhttp.setRequestHeader("Cache-Control", "no-cache");
		if(!param['mode_name']){
			var str = "mode_name="+url+"&";
			str += "nonedata="+nonedatav+"&";
		}else{
			var str = '';
			str += "nonedata="+nonedatav+"&";
		}
		for(var i in param){
			str += i + "=" + encodeURIComponent(param[i]) + "&";
		}
		str = str.substring(0,str.length -1);
		xmlhttp.send(str);

		var str = xmlhttp.responseText;
		var webdata = eval("("+str+")");
		if (webdata){
			webdata = webdata.data;
		}
		if(currentCallBack)
		{
			currentCallBack(webdata);
		}

	}catch(e){
	}
}
function processResponse() {
	if ( xmlhttp.readyState == 4 ) {
		if ( xmlhttp.status == 200 ||  xmlhttp.status==0) {
			var str = xmlhttp.responseText;
			var webdata = eval("("+str+")");
			if (webdata){
				webdata = webdata.data;
			}
			if(currentCallBack){
				currentCallBack(webdata);
			}
		}
	}
}
