# 把 Python 项目自动打包成 Android APK（在 GitHub 的免费 Linux 机器上跑 buildozer）
name: build-apk

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - uses: actions/checkout@v4

      # 关键修复：强行指定 Java 17（GitHub 默认环境可能不匹配）
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip openjdk-17-jdk python3-pip python3-venv \
            autoconf libtool libltdl-dev pkg-config zlib1g-dev libncurses-dev \
            libtinfo6 cmake libffi-dev libssl-dev

      - name: 安装 buildozer 和指定版本的 Cython
        run: |
          python3 -m pip install --upgrade pip
          # 固定 Cython 版本，防止最新版不兼容 Kivy 编译
          python3 -m pip install buildozer cython==0.29.36 virtualenv

      - name: 复制核心模块到 android/
        run: |
          cp netctl_core.py ont_core.py crypto_compat.py android/

      - name: 检查打包配置
        run: |
          set -e
          test -f android/buildozer.spec || { echo "::error::缺少 android/buildozer.spec"; exit 1; }
          test -f android/main.py || { echo "::error::缺少 android/main.py"; exit 1; }

      - name: 缓存 buildozer（第一次慢，之后快很多）
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            android/.buildozer
          key: buildozer-v2-${{ hashFiles('android/buildozer.spec') }}

      - name: 打包 APK（增加内存防溢出机制）
        working-directory: android
        run: |
          # 1. 清理上次可能失败残留的编译文件，防止二次污染
          rm -rf .buildozer/android/platform/build-*
          
          # 2. 挂载 2GB 交换空间 (Swap)，防止编译时内存耗尽被杀
          sudo fallocate -l 2G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          
          # 3. 限制 Java 堆内存，并关闭 Gradle 守护进程，释放内存
          export _JAVA_OPTIONS="-Xmx2G"
          export GRADLE_OPTS="-Xmx2048m -Dorg.gradle.daemon=false"
          
          export PATH="$HOME/.local/bin:$PATH"
          buildozer -v android debug

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: netctl-apk
          path: android/bin/*.apk
          if-no-files-found: error