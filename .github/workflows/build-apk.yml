# 把 Python 项目自动打包成 Android APK（在 GitHub 的 Linux 机器上跑 buildozer）
# 推送到 main 分支自动触发，也可以在 Actions 页面手动 Run workflow。
name: build-apk

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  apk:
    # 固定 22.04：buildozer 兼容性比 24.04 好
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip openjdk-17-jdk python3-pip python3-venv \
            autoconf libtool libltdl-dev pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev

      - name: 安装 buildozer
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install buildozer virtualenv

      - name: 准备内存（不足 4G swap 时补一个，幂等）
        run: |
          set -x
          free -h || true
          nproc || true
          CUR=$(swapon --show=SIZE --noheadings --bytes 2>/dev/null | awk '{s+=$1} END {print s+0}')
          echo "current swap bytes: ${CUR:-0}"
          if [ "${CUR:-0}" -lt 4000000000 ]; then
            if sudo fallocate -l 4G /mnt/swapfile_ci 2>/dev/null; then
              SWAP=/mnt/swapfile_ci
            else
              SWAP=/swapfile_ci
              sudo dd if=/dev/zero of="$SWAP" bs=1M count=4096 status=none
            fi
            sudo chmod 600 "$SWAP"
            sudo mkswap "$SWAP" >/dev/null
            sudo swapon "$SWAP" || true
          fi
          swapon --show || true
          free -h || true

      - name: 复制核心模块到 android/
        run: cp netctl_core.py ont_core.py crypto_compat.py android/

      - name: 检查打包配置（缺文件立刻报错，别浪费时间）
        run: |
          set -e
          test -f android/buildozer.spec || { echo "::error::缺少 android/buildozer.spec，检查 .gitignore"; exit 1; }
          test -f android/main.py || { echo "::error::缺少 android/main.py"; exit 1; }
          ls -l android/

      - name: 缓存 buildozer（第一次慢，之后快很多）
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            android/.buildozer
          key: buildozer-v3-${{ hashFiles('android/buildozer.spec') }}

      - name: 打包 APK
        working-directory: android
        env:
          # 限制 Java/Gradle 内存，避免和 NDK 编译抢内存
          _JAVA_OPTIONS: "-Xmx1536m"
          GRADLE_OPTS: "-Xmx1536m -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=1 -Dorg.gradle.parallel=false"
          MAKEFLAGS: "-j2"
        run: |
          set -e
          rm -rf .buildozer/android/platform/build-* || true
          export PATH="$HOME/.local/bin:$PATH"
          buildozer -v android debug

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: netctl-apk
          path: android/bin/*.apk
          if-no-files-found: error
